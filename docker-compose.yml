services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: artcraft-postgres
    ports:
      - "5432:5432" # PostgreSQL Port
    environment:
      POSTGRES_DB: artcraft
      POSTGRES_USER: artcraft
      POSTGRES_PASSWORD: artcraft_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artcraft -d artcraft"]
      interval: 4s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  # 2. MinIO Community Edition (S3 Compatible Object Storage)
  minio:
    image: artcraft-minio:latest
    container_name: artcraft-minio
    command: server /bitnami/minio/data --console-address ":9001"
    ports:
      - "9000:9000" # MinIO S3 API
      - "9001:9001" # MinIO Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BROWSER: "on"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 4s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  # 3. Automated S3 Bucket Initializer (Bucket + Public Download Policy)
  minio-init:
    image: artcraft-minio:latest
    container_name: artcraft-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      HOME: /tmp
    entrypoint: >
      /bin/sh -c "
        export HOME=/tmp;
        until /opt/bitnami/minio-client/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123; do
          echo 'Waiting for MinIO connection...';
          sleep 1;
        done;
        /opt/bitnami/minio-client/bin/mc mb --ignore-existing myminio/artcraft-packages;
        /opt/bitnami/minio-client/bin/mc anonymous set download myminio/artcraft-packages;
        echo 'Bucket artcraft-packages created with anonymous download policy!';
        exit 0;
      "

  # 4. Rust Axum Backend (Distribution & Mirror Engine with PostgreSQL + S3 + WebSocket)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: artcraft-server
    ports:
      - "8080:8080" # Backend API, Feed & WebSocket (/ws)
    environment:
      PORT: "8080"
      ADMIN_PASSWORD: "admin123"
      STORAGE_DIR: "/app/storage"
      DATABASE_URL: "postgres://artcraft:artcraft_pass@postgres:5432/artcraft"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "artcraft-packages"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin123"
      S3_REGION: "us-east-1"
      S3_PUBLIC_URL: "http://localhost:9000/artcraft-packages"
      STORAGE_MODE: "s3"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - server_storage:/app/storage
    restart: unless-stopped

  # 5. Next.js 16 Web Admin Dashboard (WebSocket Live updates + PostgreSQL & S3 Explorer)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: artcraft-admin
    ports:
      - "3000:3000" # Next.js Web Admin Dashboard
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      NEXT_PUBLIC_MINIO_CONSOLE_URL: "http://localhost:9001"
      NEXT_PUBLIC_MINIO_S3_URL: "http://localhost:9000/artcraft-packages"
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  server_storage:
