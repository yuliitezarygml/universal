name: iskra-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iskra
      POSTGRES_PASSWORD: ${ISKRA_DB_PASSWORD:-iskra_local_dev}
      POSTGRES_DB: iskra
    ports:
      - '127.0.0.1:${ISKRA_DB_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
